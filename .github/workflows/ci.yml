name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Unit tests and coverage
        run: yarn workspace vecal test:coverage
      - name: Build, pack, and consumer fixtures
        run: yarn workspace vecal test:smoke
      - name: Public type consumer
        run: yarn workspace vecal test:types
      - name: Documentation build
        run: yarn workspace docs build

  browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build package
        run: yarn workspace vecal build
      - name: Install browser runtimes
        run: yarn playwright install --with-deps chromium firefox webkit
      - name: Chromium, Firefox, and WebKit tests
        run: yarn workspace vecal test:browser
      - name: Packed Vite browser consumer
        run: yarn workspace vecal test:consumers:browser
      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: packages/vecal/test-results
          if-no-files-found: ignore
          retention-days: 7
